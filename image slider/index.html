<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slider">
    <div class="slides">
        <img class="slide displayslide" src="image1.png" alt="image1">
        <img class="slide" src="image2.png" alt="image2">
        <img class="slide" src="image3.png" alt="image3">
        <img class="slide" src="image4.png" alt="image4">
        <img class="slide" src="image5.png" alt="image5">
        <img class="slide" src="image6.png" alt="image6">
    </div>

    <button id="prev" onclick="prevSlide()">&lt;</button>
    <button id="next" onclick="nextSlide()">&gt;</button>
</div>

<script src="index.js"></script>
</body>
</html>
